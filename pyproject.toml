[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-eval-toolkit"
version = "3.0.0"
description = "RAG evaluation toolkit with readable LLM-judge prompts and local-first (Ollama) support."
readme = "README.md"
authors = [{ name = "Abanoub Rodolf Boctor", email = "abanoub.rodolf@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = ["rag", "evaluation", "llm", "retrieval", "generation", "ragas", "benchmark", "llm-as-judge"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.0.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "requests>=2.28.0",
    "numpy>=1.20.0",
]

[project.urls]
Homepage = "https://gitlab.com/abanoub.rodolf/rag-eval-toolkit"
Repository = "https://gitlab.com/abanoub.rodolf/rag-eval-toolkit"
Issues = "https://gitlab.com/abanoub.rodolf/rag-eval-toolkit/-/issues"

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.25.0"]
gemini = ["google-genai>=1.0.0"]
ollama = []
litellm = ["litellm>=1.0.0"]
dev = ["pytest>=7.0.0", "pytest-asyncio>=0.21.0", "ruff>=0.4.0"]
all = [
    "openai>=1.0.0",
    "anthropic>=0.25.0",
    "google-genai>=1.0.0",
    "litellm>=1.0.0",
]

[project.scripts]
rag-eval = "rag_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C4", "UP"]
ignore = ["E501"]
