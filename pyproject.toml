[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-eval-toolkit"
version = "1.0.0"
description = "Production-grade toolkit for evaluating RAG (Retrieval-Augmented Generation) pipelines."
readme = "README.md"
authors = [{ name = "Abanoub Rodolf Boctor", email = "abanoub.rodolf@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "requests>=2.28.0",
    "numpy>=1.20.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.25.0"]
gemini = ["google-generativeai>=0.7.0"]
ollama = []
litellm = ["litellm>=1.0.0"]
report = ["jinja2>=3.0.0"]
dev = ["pytest>=7.0.0", "pytest-asyncio>=0.21.0"]
all = [
    "openai>=1.0.0",
    "anthropic>=0.25.0",
    "google-generativeai>=0.7.0",
    "litellm>=1.0.0",
    "jinja2>=3.0.0",
]

[project.scripts]
rag-eval = "rag_eval.cli:main"

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "B", "C4", "UP"]
ignore = ["E501"]

[tool.mypy]
strict = true
ignore_missing_imports = true
